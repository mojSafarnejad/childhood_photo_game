<style>
  :root{
    --ink:#1C2541;
    --ink-soft:#2C365A;
    --paper:#F7F1E3;
    --paper-soft:#EFE6D2;
    --gold:#E2A63B;
    --gold-deep:#B9832A;
    --teal:#2F6F64;
    --rose:#C1473C;
    --line:#D8CBAA;
    --text:#232323;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:"Segoe UI","Tahoma","Vazirmatn",sans-serif;
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--ink);
    color:var(--paper);
    padding:14px 18px 0 18px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .brand-logo{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:0 0 auto;}
  .brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px;}
  .tabs{display:flex;gap:4px;overflow-x:auto;}
  .tab{background:transparent;border:none;color:#C9CFE0;padding:10px 14px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);}

  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px 16px;}
  .hint-muted{color:#6b6455;font-size:13.5px;line-height:1.9;}
  .section-title{font-size:17px;font-weight:800;margin:26px 0 10px 0;}
  .conn-note{font-size:12.5px;padding:8px 12px;border-radius:8px;margin-bottom:14px;}
  .conn-note.ok{background:#dff1ec;color:var(--teal);}
  .conn-note.bad{background:#f4dedb;color:var(--rose);}

  .btn{border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:700;}
  .btn-gold{background:var(--gold);color:#241a04;}
  .btn-gold:hover{background:var(--gold-deep);}
  .btn-outline{background:transparent;border:1.5px solid var(--ink);color:var(--ink);}
  .btn-ghost{background:transparent;color:var(--rose);border:1.5px solid transparent;}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn:disabled{opacity:.45;cursor:default;}

  .person-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;display:flex;gap:14px;align-items:flex-start;}
  .num-badge{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--gold);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .card-fields{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}
  .row2{display:flex;gap:10px;flex-wrap:wrap;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;}
  .field label{font-size:12px;color:#6b6455;font-weight:700;}
  .field input{border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:14px;background:var(--paper);}
  .photo-box{flex:0 0 auto;width:96px;height:96px;border-radius:10px;overflow:hidden;background:var(--paper-soft);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;position:relative;}
  .photo-box img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .photo-placeholder{font-size:11px;color:#a49a80;text-align:center;padding:6px;}
  .card-actions{display:flex;gap:8px;margin-top:4px;align-items:center;}
  .saved-pill{font-size:11.5px;color:var(--teal);font-weight:700;}

  .tv-screen{background:var(--ink);border-radius:16px;padding:22px;margin-top:6px;}
  .tv-title{color:var(--paper);font-size:15px;font-weight:700;margin:0 0 14px 0;opacity:.85;}
  .wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px;}
  .polaroid{background:#fff;border-radius:6px;padding:8px 8px 20px 8px;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.3);}
  .polaroid .ph{width:100%;aspect-ratio:1/1;border-radius:2px;overflow:hidden;background:var(--paper-soft);display:flex;align-items:center;justify-content:center;}
  .polaroid .ph img{width:100%;height:100%;object-fit:cover;}
  .polaroid .tag{position:absolute;bottom:-10px;left:50%;transform:translateX(50%);background:var(--gold);color:#241a04;font-weight:800;font-size:14px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35);}

  .name-gate{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;max-width:420px;margin:20px auto;text-align:center;}
  .name-gate input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:15px;margin:14px 0;background:var(--paper);text-align:center;}
  .guest-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .guest-header .who{font-weight:800;}
  .num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;}
  .num-cell{aspect-ratio:1/1;border-radius:10px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid var(--line);color:var(--ink);}
  .num-cell.correct{background:var(--teal);color:#fff;border-color:var(--teal);}
  .num-cell.wrong{background:#f4dedb;color:var(--rose);border-color:var(--rose);}

  .detail-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px;}
  .detail-photo{width:100%;max-width:260px;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--paper-soft);margin:0 auto 14px auto;display:flex;align-items:center;justify-content:center;}
  .detail-photo img{width:100%;height:100%;object-fit:cover;}
  .hint-row{display:flex;gap:8px;margin-bottom:10px;}
  .hint-box{flex:1;border:1px dashed var(--line);border-radius:9px;padding:10px;font-size:13.5px;background:var(--paper);min-height:44px;display:flex;align-items:center;}
  .hint-box.locked{color:#a49a80;justify-content:center;}
  .result-badge{text-align:center;font-weight:800;padding:10px;border-radius:9px;margin-top:10px;font-size:15px;}
  .result-badge.ten{background:#dff1ec;color:#1f7a53;}
  .result-badge.five{background:#e3edf9;color:#2E6FB0;}
  .result-badge.two{background:#fdf0dd;color:#B9832A;}
  .result-badge.zero{background:#f9dcd8;color:#C1473C;}

  .pt{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:26px;padding:0 9px;border-radius:20px;font-weight:800;font-size:13.5px;color:#fff;margin:0 2px;}
  .pt-green{background:#2FA774;}
  .pt-blue{background:#2E6FB0;}
  .pt-orange{background:#E2952E;}
  .pt-red{background:#D9463B;}

  .howto-card{background:#fff;border:2px solid var(--gold);border-radius:16px;padding:18px;margin-bottom:16px;}
  .howto-title{font-size:21px;font-weight:900;color:var(--ink);margin-bottom:4px;}
  .howto-sub{font-size:15.5px;font-weight:800;color:var(--gold-deep);margin-bottom:12px;}
  .howto-steps{margin:0;padding-right:20px;display:flex;flex-direction:column;gap:9px;}
  .howto-steps li{font-size:13.5px;line-height:2;color:var(--text);}

  .hint-tile{border:1.5px dashed var(--line);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;background:var(--paper);transition:background .15s;}
  .hint-tile.opened{border-style:solid;border-color:var(--gold);background:#fffaf0;cursor:default;}
  .hint-tile.disabled{opacity:.55;cursor:default;}
  .hint-tile-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
  .hint-tile-icon{font-size:18px;flex:0 0 auto;}
  .hint-tile-text{font-size:13.5px;line-height:1.8;}
  .hint-tile-label{font-weight:800;font-size:14px;color:var(--ink);}
  .hint-tile-cost{font-size:11.5px;color:var(--gold-deep);font-weight:700;white-space:nowrap;}
  .hint-tile-tag{font-size:11px;color:var(--teal);font-weight:800;background:#dff1ec;padding:2px 8px;border-radius:12px;white-space:nowrap;}

  .guess-input-wrap{margin-top:14px;}
  .guess-input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;background:#fff;}
  .guess-input:focus{outline:none;border-color:var(--gold);}
  .guess-status{font-size:12px;margin:6px 2px 12px 2px;font-weight:700;min-height:14px;}
  .guess-status.found{color:var(--teal);}
  .guess-status.notfound{color:#a49a80;}

  .name-chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .name-chip{padding:9px 15px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:700;color:var(--ink);transition:background .12s,border-color .12s,color .12s;}
  .name-chip.selected{background:var(--gold);border-color:var(--gold-deep);color:#241a04;box-shadow:0 2px 6px rgba(0,0,0,.15);}

  .lb-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;}
  .lb-rank{font-weight:800;width:26px;color:var(--gold-deep);}
  .lb-name{flex:1;font-weight:700;}
  .lb-score{font-weight:800;color:var(--ink);}
  .lb-row.top1{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;}

  select.guess-select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14.5px;background:var(--paper);margin-bottom:12px;}
  .empty-note{color:#a49a80;text-align:center;padding:30px 10px;font-size:14px;}
</style>
</head>

<script>
// ============== Backend (Cloudflare Worker + KV) ==============
const API_BASE = "https://baby-game-api.nova-6b8927.workers.dev";

async function kvGet(key){
  try{
    const r = await fetch(API_BASE + "/kv/" + encodeURIComponent(key));
    if(!r.ok) return null;
    const d = await r.json();
    return d.value ?? null;
  }catch(e){ console.error("kvGet failed:", e); return null; }
}
async function kvSet(key, valueStr){
  try{
    const r = await fetch(API_BASE + "/kv/" + encodeURIComponent(key), { method:"PUT", body: valueStr });
    if(!r.ok) return false;
    const d = await r.json();
    return !!d.ok;
  }catch(e){ console.error("kvSet failed:", e); return false; }
}
async function kvDelete(key){
  try{ await fetch(API_BASE + "/kv/" + encodeURIComponent(key), { method:"DELETE" }); }
  catch(e){ console.error("kvDelete failed:", e); }
}
async function kvList(prefix){
  try{
    const r = await fetch(API_BASE + "/list/" + encodeURIComponent(prefix));
    if(!r.ok) return [];
    const d = await r.json();
    return d.keys || [];
  }catch(e){ console.error("kvList failed:", e); return []; }
}

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

const ADMIN_PASSWORD = "sbg@4444"; // change this line to update the admin password
let adminUnlocked = false; // resets on page reload, on purpose

let currentTab = 'admin';
let people = [];        // [{number,name,hint1,hint2,photo}]
let guestName = '';     // in-memory only, resets on page reload
let guestAnswers = {};  // {number: {guess, hintsUsed, hintsShown:[bool,bool], correct, score, submitted}}
let pollTimer = null;   // used by TV wall / guest / leaderboard for periodic refresh

function slug(s){ return s.trim().replace(/[\s\/\\'".#$\[\]]+/g,'_').slice(0,60) || 'مهمان'; }

// ---------------- data helpers ----------------
async function loadPeopleOnce(){
  const keys = await kvList('person:');
  const items = [];
  for(const k of keys){
    const v = await kvGet(k);
    if(v){ try{ items.push(JSON.parse(v)); }catch(e){} }
  }
  items.sort((a,b)=>a.number-b.number);
  return items;
}
async function savePerson(p){
  for(let attempt=1; attempt<=3; attempt++){
    const ok = await kvSet('person:'+p.number, JSON.stringify(p));
    if(ok) return true;
    if(attempt<3) await new Promise(r=>setTimeout(r, 700*attempt));
  }
  return false;
}
async function deletePersonKey(number){ await kvDelete('person:'+number); }

async function loadGuestOnce(name){
  const v = await kvGet('guest:'+slug(name));
  if(!v) return {};
  try{ const d = JSON.parse(v); return d.answers || {}; }catch(e){ return {}; }
}
async function saveGuestAnswers(name, answers){
  await kvSet('guest:'+slug(name), JSON.stringify({displayName:name, answers}));
}
async function loadLeaderboard(){
  const keys = await kvList('guest:');
  const arr = [];
  for(const k of keys){
    const v = await kvGet(k);
    if(!v) continue;
    try{
      const d = JSON.parse(v);
      const total = Object.values(d.answers||{}).reduce((s,a)=>s+(a.score||0),0);
      arr.push({name: d.displayName || '؟', total});
    }catch(e){}
  }
  arr.sort((a,b)=>b.total-a.total);
  return arr;
}

function fileToCompressedDataURL(file, maxW=440, quality=0.6){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------------- rendering ----------------
function renderApp(){
  clearInterval(pollTimer);
  const app = $('#app');
  if(currentTab==='admin') renderAdmin(app);
  else if(currentTab==='tv') renderTV(app);
  else if(currentTab==='guest') renderGuest(app);
  else if(currentTab==='lb') renderLeaderboard(app);
}

// ---- ADMIN ----
async function renderAdmin(app){
  if(!adminUnlocked){
    app.innerHTML = `<div class="name-gate">
        <div style="font-weight:800;font-size:16px;">پنل مدیریت قفله 🔒</div>
        <div class="hint-muted">رمز عبور رو وارد کن</div>
        <input type="password" id="adminPassInput" placeholder="رمز عبور">
        <button class="btn btn-gold" id="adminUnlockBtn" style="width:100%;">ورود</button>
        <div id="adminPassError" style="color:var(--rose);font-size:13px;margin-top:8px;"></div>
      </div>`;
    const tryUnlock = async ()=>{
      const v = $('#adminPassInput').value;
      if(v === ADMIN_PASSWORD){ adminUnlocked = true; await renderAdmin(app); }
      else{ $('#adminPassError').textContent = 'رمز اشتباهه، دوباره امتحان کن.'; }
    };
    $('#adminUnlockBtn').onclick = tryUnlock;
    $('#adminPassInput').onkeydown = e=>{ if(e.key==='Enter') tryUnlock(); };
    $('#adminPassInput').focus();
    return;
  }
  app.innerHTML = `
    <div class="conn-note ok" id="connNote">در حال اتصال به دیتابیس…</div>
    <div class="hint-muted">
      هر نفر رو با شماره، اسم، دو راهنمایی و عکسش وارد کنید. عکس‌ها خودکار فشرده می‌شن.
      این پنل فقط برای شما (میزبان) هست؛ لینک همین صفحه رو با مهمون‌ها به تب «میهمان» راهنمایی کنید.
    </div>
    <div id="personList" class="section-title">در حال بارگذاری…</div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
      <button class="btn btn-gold" id="addPersonBtn">+ افزودن نفر جدید</button>
      <button class="btn btn-ghost" id="resetScoresBtn">پاک‌کردن فقط امتیازها</button>
      <button class="btn btn-ghost" id="resetAllBtn">پاک‌کردن کل بازی</button>
    </div>`;
  $('#addPersonBtn').onclick = async ()=>{
    const num = (people.length ? Math.max(...people.map(p=>p.number)) : 0) + 1;
    people.push({number:num, name:'', hint1:'', hint2:'', photo:''});
    await drawPersonList();
  };
  $('#resetScoresBtn').onclick = async ()=>{
    if(!confirm('همه پاسخ‌ها و امتیازهای مهمون‌ها پاک بشه؟ لیست عکس‌ها دست‌نخورده می‌مونه.')) return;
    const keys = await kvList('guest:');
    for(const k of keys){ await kvDelete(k); }
    alert('امتیازها پاک شد.');
  };
  $('#resetAllBtn').onclick = async ()=>{
    if(!confirm('کل بازی (عکس‌ها، اسم‌ها، راهنمایی‌ها و امتیازها) پاک بشه؟ این کار برگشت‌ناپذیره.')) return;
    const pKeys = await kvList('person:');
    for(const k of pKeys){ await kvDelete(k); }
    const gKeys = await kvList('guest:');
    for(const k of gKeys){ await kvDelete(k); }
    people = [];
    await drawPersonList();
  };
  people = await loadPeopleOnce();
  const note = $('#connNote'); if(note) note.remove();
  await drawPersonList();
}
async function drawPersonList(){
  const box = $('#personList');
  if(!box) return;
  if(people.length===0){
    box.innerHTML = `<div class="empty-note">هنوز کسی اضافه نشده. با «افزودن نفر جدید» شروع کنید.</div>`;
    return;
  }
  box.innerHTML = '';
  box.className = '';
  people.sort((a,b)=>a.number-b.number).forEach(p=>{
    const card = document.createElement('div');
    card.className = 'person-card';
    card.innerHTML = `
      <div class="num-badge">${p.number}</div>
      <div class="photo-box" id="photoBox-${p.number}">
        ${p.photo ? `<img src="${p.photo}">` : `<div class="photo-placeholder">افزودن عکس</div>`}
        <input type="file" accept="image/*" data-num="${p.number}" class="photoInput">
      </div>
      <div class="card-fields">
        <div class="row2">
          <div class="field"><label>اسم شخص</label><input type="text" class="nameInput" data-num="${p.number}" value="${(p.name||'').replace(/"/g,'&quot;')}" placeholder="مثلاً: نگار محمدی"></div>
        </div>
        <div class="row2">
          <div class="field"><label>راهنمایی ۱</label><input type="text" class="hint1Input" data-num="${p.number}" value="${(p.hint1||'').replace(/"/g,'&quot;')}" placeholder="یه سرنخ کلی"></div>
          <div class="field"><label>راهنمایی ۲</label><input type="text" class="hint2Input" data-num="${p.number}" value="${(p.hint2||'').replace(/"/g,'&quot;')}" placeholder="یه سرنخ نزدیک‌تر"></div>
        </div>
        <div class="card-actions">
          <button class="btn btn-gold saveBtn" data-num="${p.number}">ذخیره</button>
          <button class="btn btn-ghost delBtn" data-num="${p.number}">حذف</button>
          <span class="saved-pill" id="savedPill-${p.number}"></span>
        </div>
      </div>`;
    box.appendChild(card);
  });

  $$('.photoInput', box).forEach(inp=>{
    inp.onchange = async e=>{
      const num = Number(inp.dataset.num);
      const file = e.target.files[0];
      if(!file) return;
      const dataUrl = await fileToCompressedDataURL(file);
      const p = people.find(x=>x.number===num);
      p.photo = dataUrl;
      const pb = $('#photoBox-'+num);
      pb.querySelector('img,.photo-placeholder')?.remove();
      const imgEl = document.createElement('img');
      imgEl.src = dataUrl;
      pb.prepend(imgEl);
    };
  });
  $$('.saveBtn', box).forEach(btn=>{
    btn.onclick = async ()=>{
      const num = Number(btn.dataset.num);
      const p = people.find(x=>x.number===num);
      p.name = $(`.nameInput[data-num="${num}"]`).value.trim();
      p.hint1 = $(`.hint1Input[data-num="${num}"]`).value.trim();
      p.hint2 = $(`.hint2Input[data-num="${num}"]`).value.trim();
      if(!p.name){ alert('اسم شخص رو وارد کنید.'); return; }
      btn.disabled = true;
      const ok = await savePerson(p);
      btn.disabled = false;
      const pill = $('#savedPill-'+num);
      if(pill){
        pill.textContent = ok ? 'ذخیره شد ✓' : 'خطا در ذخیره، دوباره امتحان کن';
        pill.style.color = ok ? 'var(--teal)' : 'var(--rose)';
        if(ok) setTimeout(()=>{ if(pill) pill.textContent=''; }, 2200);
      }
    };
  });
  $$('.delBtn', box).forEach(btn=>{
    btn.onclick = async ()=>{
      const num = Number(btn.dataset.num);
      if(!confirm('این نفر حذف بشه؟')) return;
      await deletePersonKey(num);
      people = people.filter(x=>x.number!==num);
      await drawPersonList();
    };
  });
}

// ---- TV WALL ----
async function renderTV(app){
  app.innerHTML = `<div class="tv-screen">
      <p class="tv-title">همه عکس‌ها رو نگاه کنید و با شماره‌شون توی فرم میهمان حدس بزنید</p>
      <div class="wall-grid" id="wallGrid">در حال بارگذاری…</div>
    </div>`;
  const draw = async ()=>{
    people = await loadPeopleOnce();
    const grid = $('#wallGrid');
    if(!grid) return;
    if(people.length===0){ grid.innerHTML = `<div class="empty-note" style="color:#C9CFE0">هنوز عکسی در پنل مدیریت اضافه نشده.</div>`; return; }
    grid.innerHTML = people.map(p=>`
      <div class="polaroid">
        <div class="ph">${p.photo?`<img src="${p.photo}">`:''}</div>
        <div class="tag">${p.number}</div>
      </div>`).join('');
  };
  await draw();
  pollTimer = setInterval(draw, 8000);
}

// ---- GUEST ----
async function renderGuest(app){
  if(!guestName){
    app.innerHTML = `<div class="name-gate">
        <div style="font-weight:800;font-size:16px;">اسمت رو وارد کن</div>
        <div class="hint-muted">این اسم روی جدول امتیازات نشون داده می‌شه</div>
        <input type="text" id="guestNameInput" placeholder="مثلاً: سارا">
        <button class="btn btn-gold" id="guestStartBtn" style="width:100%;">شروع بازی</button>
      </div>`;
    $('#guestStartBtn').onclick = async ()=>{
      const v = $('#guestNameInput').value.trim();
      if(!v){ alert('اسمت رو بنویس'); return; }
      guestName = v;
      guestAnswers = await loadGuestOnce(guestName);
      renderApp();
    };
    return;
  }
  app.innerHTML = `
    <div class="guest-header">
      <div class="who">سلام ${guestName} 👋</div>
      <button class="btn btn-outline" id="switchBtn">تغییر اسم</button>
    </div>
    <div class="howto-card">
      <div class="howto-title">🎉 چطور بازی کنیم؟</div>
      <div class="howto-sub">هر کی بیشتر درست حدس بزنه، برنده می‌شه! 🏆</div>
      <ol class="howto-steps">
        <li>شماره‌ی هر عکسی که می‌خوای حدس بزنی، متعلق به کودکی کدوم‌یکی از همکارات هست رو انتخاب کن.</li>
        <li>می‌تونی بدون راهنمایی جواب بدی (<span class="pt pt-green">۱۰</span>)، با یک راهنمایی (<span class="pt pt-blue">۵</span>) یا با دو راهنمایی (<span class="pt pt-orange">۲</span>) جواب بدی؛ جواب اشتباه (<span class="pt pt-red">۰</span>) امتیازه.</li>
        <li>اسم رو از لیست انتخاب کن و ثبت کن؛ می‌تونی توی «جدول امتیازات» جایگاه خودت رو زنده ببینی!</li>
      </ol>
    </div>
    <div class="num-grid" id="numGrid" style="margin-top:14px;">در حال بارگذاری…</div>
    <div id="detailArea"></div>`;
  $('#switchBtn').onclick = ()=>{ guestName=''; guestAnswers={}; renderApp(); };
  const refreshPeople = async ()=>{ people = await loadPeopleOnce(); drawNumGrid(); };
  await refreshPeople();
  pollTimer = setInterval(refreshPeople, 12000);
}
function drawNumGrid(){
  const grid = $('#numGrid');
  if(!grid) return;
  if(people.length===0){ grid.innerHTML = `<div class="empty-note">هنوز بازی آماده نیست، کمی صبر کن.</div>`; return; }
  grid.innerHTML = people.map(p=>{
    const a = guestAnswers[p.number];
    let cls = '';
    if(a && a.submitted) cls = a.correct ? 'correct' : 'wrong';
    return `<button class="num-cell ${cls}" data-num="${p.number}">${p.number}</button>`;
  }).join('');
  $$('.num-cell', grid).forEach(btn=>{
    btn.onclick = ()=> openDetail(Number(btn.dataset.num));
  });
}
function openDetail(num){
  const p = people.find(x=>x.number===num);
  if(!p) return;
  const a = guestAnswers[num] || {hintsShown:[false,false], hintsUsed:0, submitted:false};
  const detail = $('#detailArea');
  const namesShuffled = people.slice().sort(()=>Math.random()-0.5);
  detail.innerHTML = `
    <div class="detail-card">
      <div style="font-weight:800;margin-bottom:10px;">شماره ${num}</div>
      <div class="detail-photo">${p.photo?`<img src="${p.photo}">`:''}</div>
      <div class="hint-tile ${a.hintsShown[0] ? 'opened' : (a.submitted?'disabled':'')}" data-i="1">
        <div class="hint-tile-left">
          <span class="hint-tile-icon">💡</span>
          <span class="${a.hintsShown[0] ? 'hint-tile-text' : 'hint-tile-label'}">${a.hintsShown[0] ? p.hint1 : 'راهنمایی ۱ رو ببینم'}</span>
        </div>
        ${a.hintsShown[0] ? `<span class="hint-tile-tag">دیده شد ✓</span>` : `<span class="hint-tile-cost">امتیازت می‌شه ۵</span>`}
      </div>
      <div class="hint-tile ${a.hintsShown[1] ? 'opened' : (a.submitted?'disabled':'')}" data-i="2">
        <div class="hint-tile-left">
          <span class="hint-tile-icon">💡</span>
          <span class="${a.hintsShown[1] ? 'hint-tile-text' : 'hint-tile-label'}">${a.hintsShown[1] ? p.hint2 : 'راهنمایی ۲ رو ببینم'}</span>
        </div>
        ${a.hintsShown[1] ? `<span class="hint-tile-tag">دیده شد ✓</span>` : `<span class="hint-tile-cost">امتیازت می‌شه ۲</span>`}
      </div>
      ${a.submitted ? `
        <div class="result-badge ${a.correct ? (a.hintsUsed===0?'ten':a.hintsUsed===1?'five':'two') : 'zero'}">
          ${a.correct ? `✅ درست! ${a.score} امتیاز گرفتی` : `❌ اشتباه بود، جواب درست: ${p.name}`}
        </div>
      ` : `
        <div class="hint-tile-label" style="margin-top:14px;margin-bottom:2px;">فکر می‌کنم این شخصه:</div>
        <div class="name-chip-grid" id="nameChipGrid">
          ${namesShuffled.map(n=>`<button type="button" class="name-chip" data-num="${n.number}">${n.name}</button>`).join('')}
        </div>
        <button class="btn btn-teal" id="submitGuessBtn" style="width:100%;margin-top:14px;" disabled>تایید</button>
      `}
      <div style="margin-top:10px;"><button class="btn btn-ghost" id="closeDetailBtn">بستن</button></div>
    </div>`;

  $$('.hint-tile', detail).forEach(tile=>{
    tile.onclick = async ()=>{
      if(a.submitted) return;
      const i = Number(tile.dataset.i);
      if(a.hintsShown[i-1]) return;
      a.hintsShown[i-1] = true;
      a.hintsUsed = a.hintsShown.filter(Boolean).length;
      guestAnswers[num] = a;
      await saveGuestAnswers(guestName, guestAnswers);
      openDetail(num);
    };
  });
  const submitBtn = $('#submitGuessBtn', detail);
  let matchedNumber = null;
  $$('.name-chip', detail).forEach(chip=>{
    chip.onclick = ()=>{
      $$('.name-chip', detail).forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      matchedNumber = Number(chip.dataset.num);
      if(submitBtn) submitBtn.disabled = false;
    };
  });
  if(submitBtn){
    submitBtn.onclick = async ()=>{
      const guessNum = matchedNumber;
      if(!guessNum){ alert('یه اسم از لیست انتخاب کن'); return; }
      const correct = guessNum === p.number;
      const hintsUsed = a.hintsShown.filter(Boolean).length;
      const score = correct ? (hintsUsed===0?10 : hintsUsed===1?5 : 2) : 0;
      a.guess = guessNum; a.hintsUsed = hintsUsed; a.correct = correct; a.score = score; a.submitted = true;
      guestAnswers[num] = a;
      submitBtn.disabled = true;
      await saveGuestAnswers(guestName, guestAnswers);
      drawNumGrid();
      openDetail(num);
    };
  }
  $('#closeDetailBtn', detail).onclick = ()=>{ detail.innerHTML=''; };
}

// ---- LEADERBOARD ----
async function renderLeaderboard(app){
  app.innerHTML = `<div class="section-title" style="margin-top:0;">جدول امتیازات زنده</div>
    <div id="lbList" class="hint-muted">در حال بارگذاری…</div>`;
  const draw = async ()=>{
    const rows = await loadLeaderboard();
    const list = $('#lbList');
    if(!list) return;
    if(rows.length===0){ list.innerHTML = `<div class="empty-note">هنوز کسی جواب ثبت نکرده.</div>`; return; }
    list.className = '';
    list.innerHTML = rows.map((r,i)=>`
      <div class="lb-row ${i===0?'top1':''}">
        <div class="lb-rank">${i+1}</div>
        <div class="lb-name">${r.name}</div>
        <div class="lb-score">${r.total} امتیاز</div>
      </div>`).join('');
  };
  await draw();
  pollTimer = setInterval(draw, 5000);
}

// ---------------- tab wiring ----------------
function setActiveTabUI(tab){ $$('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===tab)); }
$$('.tab').forEach(t=>{
  t.onclick = ()=>{
    currentTab = t.dataset.tab;
    setActiveTabUI(currentTab);
    location.hash = currentTab;
    renderApp();
  };
});

const validTabs = ['admin','tv','guest','lb'];
const initialTab = validTabs.includes(location.hash.replace('#','')) ? location.hash.replace('#','') : 'admin';
currentTab = initialTab;
setActiveTabUI(currentTab);
window.addEventListener('hashchange', ()=>{
  const t = location.hash.replace('#','');
  if(validTabs.includes(t)){ currentTab = t; setActiveTabUI(t); renderApp(); }
});
renderApp();
</script>
